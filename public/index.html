<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Depth-First Search Visualizer</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#eaf2ff;background:#07111f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#16305b 0,transparent 40%),#07111f}.shell{max-width:1050px;margin:auto;padding:42px 20px}.eyebrow{color:#76d6ff;text-transform:uppercase;letter-spacing:.14em;font-weight:800;font-size:.78rem}h1{font-size:clamp(2.3rem,7vw,5rem);line-height:.95;margin:.3em 0}.subtitle{color:#a9bad2;max-width:720px;font-size:1.08rem}.panel{margin-top:32px;padding:24px;border:1px solid #294463;border-radius:22px;background:#0d1b2dcc;box-shadow:0 25px 80px #0008}.stage{width:100%;height:480px}.edge{stroke:#49647f;stroke-width:2.2;transition:.2s}.edge.active{stroke:#fbbf24;stroke-width:5}.edge.done{stroke:#22c55e}.node circle{fill:#163a5f;stroke:#78c7ff;stroke-width:3;transition:.2s}.node text{fill:#fff;font-weight:900;font-size:16px;text-anchor:middle;dominant-baseline:middle}.node.active circle{fill:#f59e0b;stroke:#fde68a;transform:scale(1.12);transform-box:fill-box;transform-origin:center}.node.visited circle{fill:#16a34a;stroke:#86efac}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:15px}button{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer;color:#07111f;background:#7dd3fc}button.secondary{background:#233852;color:#d9e8fb}label{margin-left:auto;color:#a9bad2}.status{min-height:24px;margin-top:14px;color:#b8c8dc}.order{color:#86efac;font-weight:800}.footer{margin-top:24px;color:#64748b;font-size:.85rem}@media(max-width:600px){.stage{height:360px}label{width:100%;margin:6px 0 0}}
</style></head><body><main class="shell"><div class="eyebrow">Algorithm Lab · Graph</div><h1>Depth-First Search</h1><p class="subtitle">한 경로를 끝까지 탐색한 뒤 되돌아오는 깊이 우선 탐색 과정을 관찰하세요.</p><section class="panel"><svg id="graph" class="stage" viewBox="0 0 1000 600" role="img" aria-label="DFS graph visualization"></svg><div class="controls"><button id="start">시작</button><button id="step" class="secondary">한 단계</button><button id="reset" class="secondary">초기화</button><label>속도 <input id="speed" type="range" min="30" max="700" value="260"></label></div><div id="status" class="status" role="status">준비됨</div><div>방문 순서: <span id="order" class="order">-</span></div></section><p class="footer">Generated by Algorithm Visualizer Factory · ready</p></main>
<script>
const spec={"kind":"graph","title":"Depth-First Search","description":"한 경로를 끝까지 탐색한 뒤 되돌아오는 깊이 우선 탐색 과정을 관찰하세요.","nodes":[{"id":"A","x":50,"y":12},{"id":"B","x":25,"y":35},{"id":"C","x":75,"y":35},{"id":"D","x":12,"y":68},{"id":"E","x":38,"y":68},{"id":"F","x":64,"y":68},{"id":"G","x":88,"y":68},{"id":"H","x":50,"y":90}],"edges":[["A","B"],["A","C"],["B","D"],["B","E"],["C","F"],["C","G"],["E","H"],["F","H"]],"slug":"dfs"}, svg=document.querySelector('#graph'), status=document.querySelector('#status'), orderEl=document.querySelector('#order');
let steps=[],cursor=0,timer=null,visited=new Set(),order=[],activeNode=null,activeEdge=null,doneEdges=new Set();
const key=(a,b)=>[a,b].sort().join('-');
function buildSteps(start='A'){const adjacency=Object.fromEntries(spec.nodes.map(n=>[n.id,[]]));spec.edges.forEach(([a,b])=>{adjacency[a].push(b);adjacency[b].push(a)});const seen=new Set(),out=[];function walk(node,parent){seen.add(node);out.push({type:'visit',node,parent});for(const next of adjacency[node]){if(next===parent)continue;out.push({type:'inspect',edge:[node,next],node});if(!seen.has(next)){out.push({type:'traverse',edge:[node,next]});walk(next,node);out.push({type:'backtrack',edge:[node,next],node})}}}walk(start,null);return out}
function render(){svg.innerHTML='';for(const [a,b] of spec.edges){const na=spec.nodes.find(n=>n.id===a),nb=spec.nodes.find(n=>n.id===b),line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',na.x*10);line.setAttribute('y1',na.y*6);line.setAttribute('x2',nb.x*10);line.setAttribute('y2',nb.y*6);line.classList.add('edge');if(doneEdges.has(key(a,b)))line.classList.add('done');if(activeEdge===key(a,b))line.classList.add('active');svg.append(line)}for(const n of spec.nodes){const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.classList.add('node');if(visited.has(n.id))g.classList.add('visited');if(activeNode===n.id)g.classList.add('active');g.setAttribute('transform',`translate(${n.x*10} ${n.y*6})`);g.innerHTML='<circle r="31"></circle><text>'+n.id+'</text>';svg.append(g)}}
function prepare(){stop();steps=buildSteps();cursor=0;visited.clear();order=[];activeNode=null;activeEdge=null;doneEdges.clear();orderEl.textContent='-';status.textContent='준비됨 · 시작 정점 A · '+steps.length+' 단계';render()}
function apply(){if(cursor>=steps.length){stop();activeNode=null;activeEdge=null;render();status.textContent='완료! 방문 순서 '+order.join(' → ');return false}const op=steps[cursor++];activeEdge=op.edge?key(...op.edge):null;if(op.type==='visit'){visited.add(op.node);order.push(op.node);activeNode=op.node;orderEl.textContent=order.join(' → ')}else if(op.type==='traverse'){doneEdges.add(activeEdge)}else activeNode=op.node??null;const label={visit:'정점 방문',inspect:'간선 확인',traverse:'더 깊이 이동',backtrack:'되돌아가기'}[op.type];status.textContent=label+' · '+cursor+' / '+steps.length;render();return true}
function tick(){if(!apply())return;timer=setTimeout(tick,730-Number(document.querySelector('#speed').value))}function stop(){if(timer){clearTimeout(timer);timer=null}document.querySelector('#start').textContent='시작'}
document.querySelector('#start').onclick=()=>{if(timer){stop();return}if(cursor>=steps.length)prepare();document.querySelector('#start').textContent='일시정지';tick()};document.querySelector('#step').onclick=()=>{stop();apply()};document.querySelector('#reset').onclick=prepare;prepare();
</script></body></html>
