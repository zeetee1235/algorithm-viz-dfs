name: verify
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dfs:test .
      - run: docker run -d --name app -p 8080:8080 dfs:test
      - run: for i in {1..20}; do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 1; done; exit 1
